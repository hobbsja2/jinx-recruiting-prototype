name: Deploy to Azure Web App

# Deploys the FastAPI app to Azure App Service on every push to main.
# Prerequisites (one-time, set on the GitHub repo and the Azure app):
#   1. GitHub repo secret AZURE_WEBAPP_PUBLISH_PROFILE
#        Azure Portal -> your App Service -> "Get publish profile" (download),
#        then GitHub -> repo Settings -> Secrets and variables -> Actions ->
#        New repository secret -> name it AZURE_WEBAPP_PUBLISH_PROFILE and paste
#        the entire file contents.
#   2. Confirm AZURE_WEBAPP_NAME below matches the App Service name exactly
#        (from the hostname <name>.azurewebsites.net). If this is a deployment
#        slot rather than a standalone app, also uncomment `slot-name` below.
#   3. On the App Service (Configuration -> Application settings), ensure:
#        - SCM_DO_BUILD_DURING_DEPLOYMENT = true   (lets Azure/Oryx run pip install)
#        - Startup Command = uvicorn app.main:app --host 0.0.0.0 --port 8000
#        - DATABASE_URL / SECRET_KEY / AUTH_USERS are set (as in production today)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AZURE_WEBAPP_NAME: jinx-recruiting-staging-andyhob

permissions:
  contents: read

concurrency:
  group: azure-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
          # slot-name: staging   # uncomment only if deploying to a named slot
