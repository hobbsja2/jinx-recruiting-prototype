version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: jinx
      POSTGRES_PASSWORD: jinx_pass
      POSTGRES_DB: jinx
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_uploads:/app/static/uploads
    environment:
      - DATABASE_URL=postgresql://jinx:jinx_pass@db:5432/jinx
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

volumes:
  pgdata:
  static_uploads:
